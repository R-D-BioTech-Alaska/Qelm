name: apply-exe-build

on:
  push:
    branches: [agent/build-qelm-exe]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/build-qelm-exe
          fetch-depth: 0

      - name: Apply executable source changes
        run: |
          set -e
          if [ ! -f .qelm-exe.patch.gz.b64 ]; then
            echo "no patch to apply"
            exit 0
          fi
          base64 -d .qelm-exe.patch.gz.b64 | gzip -d > /tmp/qelm-exe.patch
          echo "5d92ff9e801eb06b2a72b3e990cf263fafa19bf65bd10a7d480100e3c911133a  /tmp/qelm-exe.patch" | sha256sum -c -
          git apply /tmp/qelm-exe.patch
          rm -f .qelm-exe.patch.gz.b64
          git add Qelm2.py qelm_exe.py QELM.spec tests/test_exe_command.py .qelm-exe.patch.gz.b64
          git diff --cached --check
          git config user.name "Inserian"
          git config user.email "99493283+Inserian@users.noreply.github.com"
          git commit -m "Add Windows executable source"
          git push origin HEAD:agent/build-qelm-exe
