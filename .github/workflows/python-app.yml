name: Python application

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install test tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install --no-deps .
          python -m pip install build nltk==3.9.4 numpy==2.1.3 psutil==7.0.0 pytest

      - name: Check source
        run: python -m compileall -q Qelm2.py QELMChatUI.py QelmInference.py QelmTokenizer.py qelm

      - name: Run tests
        run: pytest -q

      - name: Build package
        run: python -m build
