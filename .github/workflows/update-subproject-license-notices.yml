name: Update subproject license notices

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/update-subproject-license-notices.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Update archived subproject documentation
        shell: python
        run: |
          from pathlib import Path

          quantum = Path("Quantum/Readme.md")
          text = quantum.read_text(encoding="utf-8")
          replacements = {
              '<a href="#license"><img alt="License: MIT" src="https://img.shields.io/badge/License-MIT-blue.svg" /></a>':
                  '<a href="#license"><img alt="License: PolyForm Strict 1.0.0" src="https://img.shields.io/badge/License-PolyForm%20Strict%201.0.0-orange.svg" /></a>',
              'This project is released under the **MIT License**. See `LICENSE` in the root of the repository.':
                  'The current source tree is source-available under the **PolyForm Strict License 1.0.0**. Noncommercial use is permitted; distribution, modification, derivative works, sublicensing, transfer, and commercial use require separate written permission. See `LICENSE`, `LICENSE_HISTORY.md`, and `COMMERCIAL_LICENSE.md` in the repository root. Earlier versions lawfully obtained under MIT remain under their original MIT terms.'
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f"Required Quantum README text not found: {old}")
              text = text.replace(old, new)
          quantum.write_text(text, encoding="utf-8")

          moleque = Path("Moleque/Readme.md")
          text = moleque.read_text(encoding="utf-8")
          replacements = {
              'Issues and PRs welcome. Please include:':
                  'Issues and reproducibility reports are welcome. Code modifications and pull requests require prior written permission under the current source license. Please include:',
              '## License\n\nMIT':
                  '## License\n\nThe current source tree is source-available under the **PolyForm Strict License 1.0.0**. Noncommercial use is permitted; distribution, modification, derivative works, sublicensing, transfer, and commercial use require separate written permission. See `LICENSE`, `LICENSE_HISTORY.md`, and `COMMERCIAL_LICENSE.md` in the repository root. Earlier versions lawfully obtained under MIT remain under their original MIT terms.'
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f"Required Moleque README text not found: {old}")
              text = text.replace(old, new)
          moleque.write_text(text, encoding="utf-8")

          Path(".github/workflows/update-subproject-license-notices.yml").unlink()
      - name: Commit subproject notices
        run: |
          git config user.name "R&D BioTech Alaska"
          git config user.email "contact@rdbiotechalaska.com"
          git add Quantum/Readme.md Moleque/Readme.md .github/workflows/update-subproject-license-notices.yml
          git commit -m "Update archived QELM subproject license notices"
          git push

# one-time retry after source-distribution metadata update
